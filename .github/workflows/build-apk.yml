name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Generate Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK (v21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          echo "Installing npm dependencies..."
          npm install --legacy-peer-deps

      - name: Build web application
        run: |
          echo "Building Vite application..."
          npm run build

      - name: Sync Capacitor Android
        env:
          CI: 'true'
          CAPACITOR_TELEMETRY: '0'
        run: |
          echo "Checking Capacitor Android project..."
          if [ ! -d "android" ]; then
            echo "Adding Android platform..."
            npx --yes @capacitor/cli add android
          fi
          echo "Syncing web assets to Android platform..."
          npx --yes @capacitor/cli sync android

      - name: Configure Android SDK & Gradle Wrapper
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          echo "Configuring local.properties with Android SDK location..."
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties

          echo "Checking Gradle wrapper jar..."
          mkdir -p android/gradle/wrapper
          if [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ] || [ ! -s "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar not found or empty. Downloading wrapper jar..."
            curl -sLo android/gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar || \
            curl -sLo android/gradle/wrapper/gradle-wrapper.jar https://repo.maven.apache.org/maven2/org/gradle/gradle-wrapper/8.14.3/gradle-wrapper-8.14.3.jar
          fi
          ls -la android/gradle/wrapper/

          echo "Making gradlew executable..."
          chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduTrack-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
